name: Codex Review Gate Controller

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - dismissed

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

env:
  CODEX_TRUSTED_MAINTAINERS: ${{ vars.CODEX_TRUSTED_MAINTAINERS }}

jobs:
  codex-review-gate-controller:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const trustedScriptPath = path.join(
              process.env.GITHUB_WORKSPACE,
              "trusted",
              "owned/skills-github-publisher/scripts/codex_review_gate_controller.cjs",
            );
            if (!fs.existsSync(trustedScriptPath)) {
              core.info(`Trusted review gate controller is not on the base branch yet: ${trustedScriptPath}`);
              if (context.eventName !== "pull_request_review") {
                core.info("Skipping privileged gate evaluation until the trusted controller lands on the base branch.");
                return;
              }

              const pr = context.payload.pull_request;
              if (!pr || pr.draft || pr.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.info("Skipping bootstrap review gate fallback for draft or external PR.");
                return;
              }

              core.info("Using trusted bootstrap review gate fallback from workflow script.");
              const codexActors = new Set([
                "chatgpt-codex-connector[bot]",
                "chatgpt-codex-connector",
              ]);
              const reviewedCommitMatchesHead = (reviewedCommit, headSha) => {
                if (!reviewedCommit || !headSha) {
                  return false;
                }
                const normalizedReviewed = reviewedCommit.toLowerCase();
                const normalizedHead = headSha.toLowerCase();
                return (
                  normalizedReviewed === normalizedHead ||
                  normalizedHead.startsWith(normalizedReviewed) ||
                  normalizedReviewed.startsWith(normalizedHead)
                );
              };
              const setStatus = async (sha, state, description, targetUrl) => {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state,
                  context: "codex-review-gate",
                  description,
                  target_url: targetUrl,
                });
              };
              const reviews = (await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              })).slice().reverse();
              const latestCurrentHeadReview = reviews.find((review) => {
                const login = review.user?.login || "";
                return codexActors.has(login) && reviewedCommitMatchesHead(review.commit_id || "", pr.head.sha);
              });
              if (!latestCurrentHeadReview) {
                await setStatus(
                  pr.head.sha,
                  "pending",
                  "Waiting for current-head Codex review",
                  pr.html_url,
                );
                core.info(`Set codex-review-gate=pending on ${pr.head.sha} because no current-head Codex review exists yet`);
                return;
              }

              const latestCurrentHeadReviewState = String(latestCurrentHeadReview.state || "").toUpperCase();
              if (latestCurrentHeadReviewState === "DISMISSED") {
                await setStatus(
                  pr.head.sha,
                  "failure",
                  "Latest current-head Codex review was dismissed; rerun review on the current head",
                  latestCurrentHeadReview.html_url || pr.html_url,
                );
                core.info(`Set codex-review-gate=failure on ${pr.head.sha} because the latest current-head Codex review was dismissed`);
                return;
              }
              if (latestCurrentHeadReviewState === "CHANGES_REQUESTED") {
                await setStatus(
                  pr.head.sha,
                  "failure",
                  "Latest current-head Codex review requested changes",
                  latestCurrentHeadReview.html_url || pr.html_url,
                );
                core.info(`Set codex-review-gate=failure on ${pr.head.sha} because the latest current-head Codex review requested changes`);
                return;
              }

              await setStatus(
                pr.head.sha,
                "success",
                "Current head has a Codex review",
                latestCurrentHeadReview.html_url || pr.html_url,
              );
              core.info(`Set codex-review-gate=success on ${pr.head.sha} from the trusted bootstrap fallback`);
              return;
            }

            core.info(`Using trusted Codex review gate controller from ${trustedScriptPath}`);
            const loadedScript = require(trustedScriptPath);
            await loadedScript.run({
              github,
              context,
              core,
              trustedMaintainers: process.env.CODEX_TRUSTED_MAINTAINERS || "",
            });

  codex-review-gate-wrapper-validation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate review gate workflow wrapper invariants
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "tempfile"

          workflow_path = ".github/workflows/codex-review-gate.yml"
          raw = File.read(workflow_path)
          workflow = YAML.safe_load(raw, permitted_classes: [], aliases: true)
          triggers = workflow["on"] || workflow[true] || {}
          %w[pull_request pull_request_target pull_request_review].each do |event_name|
            raise "#{workflow_path} must trigger on #{event_name}" unless triggers.key?(event_name)
          end

          jobs = workflow["jobs"] || {}
          controller_job = jobs["codex-review-gate-controller"]
          raise "codex-review-gate-controller job is missing" unless controller_job.is_a?(Hash)
          wrapper_job = jobs["codex-review-gate-wrapper-validation"]
          raise "codex-review-gate-wrapper-validation job is missing" unless wrapper_job.is_a?(Hash)

          expected_controller_if = "${" + "{ github.event_name != 'pull_request' }}"
          expected_wrapper_if = "${" + "{ github.event_name == 'pull_request' }}"
          raise "codex-review-gate-controller must not run on pull_request" unless raw.include?("codex-review-gate-controller:\n    if: #{expected_controller_if}")
          raise "codex-review-gate-wrapper-validation must stay limited to pull_request" unless raw.include?("codex-review-gate-wrapper-validation:\n    if: #{expected_wrapper_if}")

          script = controller_job.fetch("steps").last.fetch("with").fetch("script")
          [
            "codex_review_gate_controller.cjs",
            "Using trusted Codex review gate controller",
            "Using trusted bootstrap review gate fallback from workflow script.",
            "Waiting for current-head Codex review",
          ].each do |snippet|
            raise "review gate wrapper is missing required snippet: #{snippet}" unless script.include?(snippet)
          end
          [
            "Using PR review gate controller",
            "const prScriptPath = path.join(",
          ].each do |snippet|
            raise "review gate wrapper must not execute PR-controlled code in privileged context: #{snippet}" if script.include?(snippet)
          end

          Tempfile.create(["codex-review-gate", ".js"]) do |handle|
            handle.write("async function __wrapper(){\n#{script}\n}\n")
            handle.flush
            raise "review gate wrapper javascript is invalid" unless system("node", "--check", handle.path)
          end

          wrapper_scripts = wrapper_job.fetch("steps", []).filter_map do |step|
            next unless step.is_a?(Hash)
            step.dig("with", "script")
          end
          dry_run_script = wrapper_scripts.find { |candidate| candidate.include?("validationOnly: true") }
          raise "review gate wrapper validation must dry-run the PR controller" unless dry_run_script
          raise "review gate wrapper validation must load the PR controller module" unless dry_run_script.include?("codex_review_gate_controller.cjs")

          puts "wrapper_ok #{workflow_path}"
          RUBY
      - name: Exercise PR review gate wrapper
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const controllerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              "owned/skills-github-publisher/scripts/codex_review_gate_controller.cjs",
            );
            if (!fs.existsSync(controllerPath)) {
              core.setFailed(`PR review gate controller is missing: ${controllerPath}`);
              return;
            }
            core.info(`Exercising PR review gate wrapper with ${controllerPath}`);
            const controller = require(controllerPath);
            const validationContext = {
              ...context,
              repo: context.repo,
              payload: {
                ...context.payload,
                pull_request: {
                  ...context.payload.pull_request,
                  head: {
                    ...context.payload.pull_request?.head,
                    repo: {
                      ...context.payload.pull_request?.head?.repo,
                      full_name: `${context.repo.owner}/${context.repo.repo}`,
                    },
                  },
                },
              },
            };
            await controller.run({
              github,
              context: validationContext,
              core,
              trustedMaintainers: process.env.CODEX_TRUSTED_MAINTAINERS || "",
              validationOnly: true,
            });
